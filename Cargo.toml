[package]
name = "polyguard"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Polyguard Security Engineering"]
license = "MIT OR Apache-2.0"
description = "Pure Rust polyglot detection, LSB steganalysis, and isolated CDR engine"

[lib]
name = "polyguard"
path = "src/lib.rs"

[[bin]]
name = "polyguard"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.47"
memchr = "2.7"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
"Win32_Foundation",
"Win32_Security",
"Win32_System_JobObjects",
"Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true